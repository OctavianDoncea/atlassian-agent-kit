name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check src tests scripts

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
        run: alembic upgrade head

      - name: Run pytest suite
        env:
          DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
          TOKEN_ENCRYPTION_KEY: ZmFrZV9rZXlfZm9yX2NpX3Rlc3RpbmdfMTIzNDU2Nzg5MA== # Base64 dummy key
        run: pytest -v

      - name: Run Eval Framework (Dry Run)
        env:
          DATABASE_URL: postgresql+psycopg2://test:test@localhost:5432/test
          TOKEN_ENCRYPTION_KEY: ZmFrZV9rZXlfZm9yX2NpX3Rlc3RpbmdfMTIzNDU2Nzg5MA==
        run: python scripts/run_evals.py --dry-run